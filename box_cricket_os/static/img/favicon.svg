<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="stadiumGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070b12" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="30%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Fiery Ball Gradient -->
    <radialGradient id="fireBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <linearGradient id="fireTail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Shadow -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#10b981" stroke-width="3" opacity="0.3" filter="url(#glow)" />

  <!-- Shield Base Circle -->
  <circle cx="250" cy="250" r="225" fill="url(#stadiumGlow)" stroke="url(#shieldBorder)" stroke-width="8" />
  
  <!-- Outer Stitched Ring (Boundary Line) -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Floodlight Beams from top -->
  <polygon points="250,50 180,220 320,220" fill="#10b981" opacity="0.12" />
  <polygon points="170,70 120,260 250,230" fill="#38bdf8" opacity="0.08" />
  <polygon points="330,70 380,260 250,230" fill="#f97316" opacity="0.08" />

  <!-- Cricket Pitch Rectangle in Center-Lower -->
  <g transform="translate(185, 200)">
    <!-- Pitch surface -->
    <rect x="0" y="0" width="130" height="150" rx="6" fill="url(#pitchGrad)" stroke="#10b981" stroke-width="2" />
    <!-- Crease lines -->
    <line x1="15" y1="35" x2="115" y2="35" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8" />
    <line x1="15" y1="120" x2="115" y2="120" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8" />
    <!-- Bowling markers -->
    <line x1="30" y1="20" x2="30" y2="50" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7" />
    <line x1="100" y1="20" x2="100" y2="50" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7" />
  </g>

  <!-- Crossed Cricket Bats -->
  <g transform="translate(250, 260)">
    <!-- Left Bat -->
    <g transform="rotate(-35)">
      <rect x="-8" y="-75" width="16" height="85" rx="3" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
      <rect x="-4" y="10" width="8" height="35" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
      <line x1="0" y1="-70" x2="0" y2="5" stroke="#d97706" stroke-width="1.5" />
    </g>
    <!-- Right Bat -->
    <g transform="rotate(35)">
      <rect x="-8" y="-75" width="16" height="85" rx="3" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
      <rect x="-4" y="10" width="8" height="35" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
      <line x1="0" y1="-70" x2="0" y2="5" stroke="#d97706" stroke-width="1.5" />
    </g>
  </g>

  <!-- Cricket Wickets / Stumps & Bails -->
  <g transform="translate(225, 215)">
    <!-- Stumps -->
    <rect x="0" y="0" width="7" height="48" rx="2" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5" />
    <rect x="21" y="0" width="7" height="48" rx="2" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5" />
    <rect x="42" y="0" width="7" height="48" rx="2" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5" />
    <!-- Bails -->
    <rect x="-2" y="-4" width="26" height="4" rx="1.5" fill="#f97316" stroke="#7c2d12" stroke-width="1" />
    <rect x="25" y="-4" width="26" height="4" rx="1.5" fill="#f97316" stroke="#7c2d12" stroke-width="1" />
  </g>

  <!-- Fire Trails behind the Fiery Cricket Ball -->
  <path d="M 290 190 C 230 180, 160 210, 120 270 C 150 250, 200 230, 260 220 Z" fill="url(#fireTail)" filter="url(#glow)" />
  <path d="M 310 160 C 270 140, 200 160, 160 210 C 190 190, 240 180, 290 180 Z" fill="#f59e0b" opacity="0.6" />
  
  <!-- Fiery Cricket Ball with Seam -->
  <g transform="translate(325, 175)">
    <circle cx="0" cy="0" r="32" fill="url(#fireBall)" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
    <!-- Ball Seam -->
    <path d="M -22 -22 C -6 -5, 5 6, 22 22" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="3 2" />
    <!-- Flame Sparks -->
    <circle cx="28" cy="-20" r="5" fill="#facc15" filter="url(#glow)" />
    <circle cx="36" cy="10" r="4" fill="#fb923c" filter="url(#glow)" />
    <circle cx="-15" cy="-35" r="6" fill="#f97316" filter="url(#glow)" />
  </g>

  <!-- Typography Banner Arc -->
  <!-- Top Arc: RUN भूमि -->
  <path id="textArcTop" d="M 85 240 A 170 170 0 0 1 415 240" fill="none" />
  <text font-family="'Outfit', 'Impact', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      <tspan fill="#ffffff">RUN </tspan>
      <tspan fill="#10b981">भूमि</tspan>
    </textPath>
  </text>

  <!-- Lower Text: BOX CRICKET -->
  <path id="textArcBottom" d="M 100 265 A 165 165 0 0 0 400 265" fill="none" />
  <text font-family="'Outfit', 'Impact', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#f97316" letter-spacing="6">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      BOX CRICKET
    </textPath>
  </text>

  <!-- Bottom Subtitle / Tagline -->
  <text x="250" y="445" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
    PREMIUM SPORTS ARENA • SHUKLAGANJ
  </text>
  
  <!-- Subtle Stadium Stars -->
  <polygon points="120,130 123,138 131,138 125,143 127,151 120,146 113,151 115,143 109,138 117,138" fill="#f59e0b" />
  <polygon points="380,130 383,138 391,138 385,143 387,151 380,146 373,151 375,143 369,138 377,138" fill="#f59e0b" />
</svg>